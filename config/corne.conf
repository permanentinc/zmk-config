# ######################################################
## OLED Display
# ######################################################


 
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n

CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
# TEMP pixel test: lights the whole drawn canvas white. Remove after testing.
CONFIG_NICE_OLED_WIDGET_INVERTED=y
# The fixed modifiers widget (default on) suppresses the WPM graph on OLED
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n


CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# ------------------------------------------------------
# ZMK Minimal Bluetooth + Battery Config
# ------------------------------------------------------

# Bond storage
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Key debounce (reduces doubled/tripled letters from switch chatter)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

# Power management
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=900000000
CONFIG_ZMK_EXT_POWER=y

