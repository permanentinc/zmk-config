# ######################################################
## OLED Display
# ######################################################


 
CONFIG_ZMK_DISPLAY=y
# WPM widget is what draws Luna the dog; off removes the dog
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_GEM_ANIMATION=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096


CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# ------------------------------------------------------
# ZMK Minimal Bluetooth + Battery Config
# ------------------------------------------------------

# Bond storage
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Key debounce (reduces doubled/tripled letters from switch chatter)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

# Power management
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=900000000
CONFIG_ZMK_EXT_POWER=y

